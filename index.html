```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>SMOU GROUP - Maintenance Report</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Tahoma,Arial;
background:#081a35;
padding:10px;
}

.container{
width:100%;
max-width:850px;
margin:auto;
background:white;
border-radius:24px;
overflow:hidden;
box-shadow:0 10px 40px rgba(0,0,0,.35);
}

.header{
background:linear-gradient(135deg,#06224d,#0b4ea2);
padding:25px 15px;
text-align:center;
color:white;
}

.header h1{
font-size:28px;
margin-bottom:5px;
}

.header p{
font-size:14px;
opacity:.9;
}

.title{
padding:16px;
text-align:center;
font-size:20px;
font-weight:bold;
background:#f1f5f9;
color:#0b3b82;
}

form{
padding:15px;
}

.grid{
display:grid;
grid-template-columns:1fr;
gap:14px;
}

@media(min-width:700px){

.grid{
grid-template-columns:1fr 1fr;
}

.buttons{
grid-template-columns:1fr 1fr 1fr;
}

}

.field label{
display:block;
margin-bottom:6px;
font-size:14px;
font-weight:bold;
color:#334155;
}

input,
textarea,
select{
width:100%;
padding:14px;
border-radius:14px;
border:1px solid #dbe3ef;
background:#f8fafc;
font-size:16px;
outline:none;
}

textarea{
resize:none;
min-height:100px;
}

input:focus,
textarea:focus,
select:focus{
border-color:#0b4ea2;
background:white;
}

.buttons{
display:grid;
grid-template-columns:1fr;
gap:10px;
margin-top:20px;
}

button{
border:none;
padding:16px;
font-size:16px;
border-radius:16px;
font-weight:bold;
color:white;
cursor:pointer;
}

.save-btn{
background:#16a34a;
}

.pdf-btn{
background:#0b4ea2;
}

.close-btn{
background:#dc2626;
}

#msg{
margin-top:15px;
text-align:center;
font-weight:bold;
font-size:15px;
color:#0b3b82;
}

.pdf-page{
width:794px;
background:white;
padding:40px;
font-family:Tahoma;
direction:rtl;
}

.pdf-box{
border:4px solid #0b4ea2;
border-radius:20px;
padding:25px;
}

.pdf-title{
text-align:center;
margin-bottom:30px;
}

.pdf-title h1{
color:#0b4ea2;
font-size:34px;
margin-bottom:10px;
}

.pdf-title p{
font-size:18px;
color:#555;
}

.pdf-table{
width:100%;
border-collapse:collapse;
font-size:15px;
}

.pdf-table td{
border:1px solid #222;
padding:12px;
vertical-align:top;
}

.label{
background:#f1f5f9;
font-weight:bold;
width:180px;
}

.signatures{
margin-top:100px;
display:flex;
justify-content:space-between;
}

.signature{
width:220px;
text-align:center;
padding-top:10px;
border-top:2px solid black;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>SMOU GROUP</h1>

<p>Elevators & Air Conditioning</p>

</div>

<div class="title">

تقرير صيانة المصاعد | Elevator Maintenance Report

</div>

<form id="form">

<div class="grid">

<div class="field">
<label>رقم التقرير</label>
<input type="text" id="reportNo" name="reportNo" readonly>
</div>

<div class="field">
<label>التاريخ</label>
<input type="text" id="date" name="date" readonly>
</div>

<div class="field">
<label>الوقت</label>
<input type="text" id="time" name="time" readonly>
</div>

<div class="field">
<label>اسم العميل</label>
<input type="text" name="customerName">
</div>

<div class="field">
<label>رقم العقد</label>
<input type="text" name="contractNo">
</div>

<div class="field">

<label>الإمارة</label>

<select name="emirate">

<option value="">اختر الإمارة</option>

<option>ابوظبي - Abu Dhabi</option>
<option>العين - Al Ain</option>
<option>دبي - Dubai</option>
<option>الشارقة - Sharjah</option>
<option>عجمان - Ajman</option>
<option>راس الخيمة - RAK</option>
<option>ام القوين - UMQ</option>
<option>الفجيرة - Fujairah</option>
<option>الغربية - Alghrbia</option>

</select>

</div>

<div class="field">
<label>المنطقة</label>
<input type="text" name="area">
</div>

<div class="field">
<label>سبب الزيارة</label>
<textarea name="visitReason"></textarea>
</div>

<div class="field">
<label>الإجراء المتبع</label>
<textarea name="actionTaken"></textarea>
</div>

<div class="field">
<label>التوصيات الفنية</label>
<textarea name="recommendation"></textarea>
</div>

<div class="field">
<label>مبلغ مطلوب</label>
<input type="text" name="requiredAmount">
</div>

<div class="field">

<label>اسم الفني</label>

<select name="technician">

<option value="">اختر الفني</option>

<option>Hassan Taher - حسن طاهر</option>
<option>Anwar Ali - أنور علي</option>
<option>Abdulaziz Alalfi - عبدالعزيز الألفي</option>
<option>Sayed Mahmoud - السيد محمود</option>
<option>Sadiq Yousif - صديق يوسف</option>

</select>

</div>

</div>

<div class="buttons">

<button
type="button"
class="save-btn"
onclick="saveAndSharePDF()">

حفظ البيانات + PDF

</button>

<button
type="button"
class="pdf-btn"
onclick="downloadPDFOnly()">

تحميل PDF فقط

</button>

<button
type="button"
class="close-btn"
onclick="window.close()">

إغلاق

</button>

</div>

<div id="msg"></div>

</form>

</div>

<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwnKQ9UKIRjULomlmJEv8R6rQvF75ZH0HMBdnxww_5ggxntGtluDcsIoI6KP_qziCQZ_g/exec";

function init(){

const now = new Date();

document.getElementById("date").value =
now.toLocaleDateString("en-CA");

document.getElementById("time").value =
now.toLocaleTimeString("en-US");

let lastNo =
localStorage.getItem("SMOU_REPORT_NO") || 1000;

lastNo++;

document.getElementById("reportNo").value =
lastNo;

localStorage.setItem("SMOU_REPORT_NO",lastNo);

}

init();

function getData(){

const form =
document.getElementById("form");

const formData =
new FormData(form);

return Object.fromEntries(formData.entries());

}

async function saveData(data){

try{

await fetch(SCRIPT_URL,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(data)

});

return true;

}catch(error){

console.error(error);

return false;

}

}

async function saveAndSharePDF(){

const msg =
document.getElementById("msg");

msg.innerHTML =
"جاري الحفظ وإنشاء PDF...";

const data =
getData();

await saveData(data);

await createPDF(data,true);

msg.innerHTML =
"✔ تم الحفظ بنجاح";

}

async function downloadPDFOnly(){

const msg =
document.getElementById("msg");

msg.innerHTML =
"جاري إنشاء PDF...";

const data =
getData();

await createPDF(data,false);

msg.innerHTML =
"✔ تم تحميل PDF";

}

async function createPDF(data,shareMode){

const page =
document.createElement("div");

page.className = "pdf-page";

page.innerHTML = `

<div class="pdf-box">

<div class="pdf-title">

<h1>SMOU GROUP</h1>

<p>Elevator Maintenance Report</p>

</div>

<table class="pdf-table">

<tr>

<td class="label">رقم التقرير</td>
<td>${data.reportNo}</td>

<td class="label">التاريخ</td>
<td>${data.date}</td>

</tr>

<tr>

<td class="label">الوقت</td>
<td>${data.time}</td>

<td class="label">اسم العميل</td>
<td>${data.customerName}</td>

</tr>

<tr>

<td class="label">رقم العقد</td>
<td>${data.contractNo}</td>

<td class="label">الإمارة</td>
<td>${data.emirate}</td>

</tr>

<tr>

<td class="label">المنطقة</td>
<td>${data.area}</td>

<td class="label">اسم الفني</td>
<td>${data.technician}</td>

</tr>

<tr>

<td class="label">سبب الزيارة</td>

<td colspan="3">
${data.visitReason}
</td>

</tr>

<tr>

<td class="label">الإجراء المتبع</td>

<td colspan="3">
${data.actionTaken}
</td>

</tr>

<tr>

<td class="label">التوصيات الفنية</td>

<td colspan="3">
${data.recommendation}
</td>

</tr>

<tr>

<td class="label">مبلغ مطلوب</td>

<td colspan="3">
${data.requiredAmount}
</td>

</tr>

</table>

<div class="signatures">

<div class="signature">
توقيع الفني
</div>

<div class="signature">
توقيع العميل
</div>

</div>

</div>

`;

document.body.appendChild(page);

const canvas =
await html2canvas(page,{
scale:2
});

const imgData =
canvas.toDataURL("image/jpeg",1);

const { jsPDF } =
window.jspdf;

const pdf =
new jsPDF({

orientation:"portrait",

unit:"px",

format:[794,1123]

});

pdf.addImage(
imgData,
"JPEG",
0,
0,
794,
1123
);

document.body.removeChild(page);

const fileName =
"Maintenance-Report-" +
data.reportNo +
".pdf";

if(shareMode){

const blob =
pdf.output("blob");

const file =
new File(
[blob],
fileName,
{type:"application/pdf"}
);

if(
navigator.canShare &&
navigator.canShare({files:[file]})
){

await navigator.share({

title:"Maintenance Report",

files:[file]

});

}else{

pdf.save(fileName);

}

}else{

pdf.save(fileName);

}

}

</script>

</body>

</html>
```
