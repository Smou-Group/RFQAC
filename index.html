<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SMOU GROUP - Maintenance Report</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Tahoma,Arial;
background:#081a35;
padding:10px;
}

.container{
width:100%;
max-width:900px;
margin:auto;
background:white;
border-radius:25px;
overflow:hidden;
box-shadow:0 15px 45px rgba(0,0,0,.35);
}

.header{
background:linear-gradient(135deg,#05204a,#0b4ea2);
padding:25px 20px;
text-align:center;
color:white;
}

.logo{
width:90px;
height:90px;
object-fit:contain;
background:white;
padding:8px;
border-radius:20px;
margin-bottom:10px;
}

.header h1{
font-size:30px;
margin-bottom:5px;
}

.header p{
font-size:15px;
opacity:.9;
}

.title{
padding:18px;
background:#f1f5f9;
text-align:center;
font-size:22px;
font-weight:bold;
color:#0b3b82;
}

form{
padding:18px;
}

.grid{
display:grid;
grid-template-columns:1fr;
gap:14px;
}

@media(min-width:700px){

.grid{
grid-template-columns:1fr 1fr;
}

.buttons{
grid-template-columns:1fr 1fr 1fr;
}

}

.field label{
display:block;
margin-bottom:6px;
font-size:14px;
font-weight:bold;
color:#334155;
}

input,
textarea,
select{
width:100%;
padding:15px;
border-radius:15px;
border:1px solid #dbe3ef;
background:#f8fafc;
font-size:16px;
outline:none;
}

textarea{
resize:none;
min-height:110px;
}

.buttons{
display:grid;
grid-template-columns:1fr;
gap:12px;
margin-top:20px;
}

button{
border:none;
padding:16px;
font-size:16px;
font-weight:bold;
border-radius:16px;
color:white;
cursor:pointer;
}

.save-btn{
background:#16a34a;
}

.pdf-btn{
background:#0b4ea2;
}

.close-btn{
background:#dc2626;
}

#msg{
margin-top:15px;
text-align:center;
font-weight:bold;
font-size:15px;
color:#0b3b82;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<img src="logo.png" class="logo">

<h1>SMOU GROUP</h1>

<p>Elevators & Air Conditioning</p>

</div>

<div class="title">

تقرير صيانة المصاعد
<br>
Elevator Maintenance Report

</div>

<form id="form">

<div class="grid">

<div class="field">
<label>رقم التقرير</label>
<input type="text" id="reportNo" name="reportNo" readonly>
</div>

<div class="field">
<label>التاريخ</label>
<input type="text" id="date" name="date" readonly>
</div>

<div class="field">
<label>الوقت</label>
<input type="text" id="time" name="time" readonly>
</div>

<div class="field">
<label>اسم العميل</label>
<input type="text" name="customerName">
</div>

<div class="field">
<label>رقم العقد</label>
<input type="text" name="contractNo">
</div>

<div class="field">

<label>الإمارة</label>

<select name="emirate">

<option value="">اختر الإمارة</option>

<option>ابوظبي - Abu Dhabi</option>
<option>العين - Al Ain</option>
<option>دبي - Dubai</option>
<option>الشارقة - Sharjah</option>
<option>عجمان - Ajman</option>
<option>راس الخيمة - RAK</option>
<option>ام القوين - UMQ</option>
<option>الفجيرة - Fujairah</option>
<option>الغربية - Alghrbia</option>

</select>

</div>

<div class="field">
<label>المنطقة</label>
<input type="text" name="area">
</div>

<div class="field">
<label>سبب الزيارة</label>
<textarea name="visitReason"></textarea>
</div>

<div class="field">
<label>الإجراء المتبع</label>
<textarea name="actionTaken"></textarea>
</div>

<div class="field">
<label>التوصيات الفنية</label>
<textarea name="recommendation"></textarea>
</div>

<div class="field">
<label>مبلغ مطلوب</label>
<input type="text" name="requiredAmount">
</div>

<div class="field">

<label>اسم الفني</label>

<select name="technician">

<option value="">اختر الفني</option>

<option>Hassan Taher - حسن طاهر</option>
<option>Anwar Ali - أنور علي</option>
<option>Abdulaziz Alalfi - عبدالعزيز الألفي</option>
<option>Sayed Mahmoud - السيد محمود</option>
<option>Sadiq Yousif - صديق يوسف</option>

</select>

</div>

</div>

<div class="buttons">

<button
type="button"
class="save-btn"
onclick="saveAndSharePDF()">

حفظ البيانات + PDF

</button>

<button
type="button"
class="pdf-btn"
onclick="downloadPDFOnly()">

تحميل PDF فقط

</button>

<button
type="button"
class="close-btn"
onclick="window.close()">

إغلاق

</button>

</div>

<div id="msg"></div>

</form>

</div>

<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwHKjkD6SguDMOiPlhepYB7dUHK2KZxLVeizmgDkBUc0iSGcUHSaFmms6xFP3ImtiIvGw/exec";

function init(){

const now = new Date();

date.value =
now.toLocaleDateString("en-CA");

time.value =
now.toLocaleTimeString("en-US");

let lastNo =
localStorage.getItem("SMOU_REPORT_NO") || 2605000;

lastNo++;

reportNo.value = lastNo;

localStorage.setItem("SMOU_REPORT_NO",lastNo);

}

init();

function getData(){

const form =
document.getElementById("form");

const formData =
new FormData(form);

return Object.fromEntries(formData.entries());

}

async function saveData(data){

try{

await fetch(SCRIPT_URL,{

method:"POST",

mode:"no-cors",

body:JSON.stringify(data)

});

return true;

}catch(error){

console.error(error);

return false;

}

}

async function saveAndSharePDF(){

msg.innerHTML =
"جاري الحفظ وإنشاء PDF...";

const data =
getData();

await saveData(data);

await createPDF(data,true);

msg.innerHTML =
"✔ تم الحفظ بنجاح";

}

async function downloadPDFOnly(){

msg.innerHTML =
"جاري إنشاء PDF...";

const data =
getData();

await createPDF(data,false);

msg.innerHTML =
"✔ تم تحميل PDF";

}

async function createPDF(data,shareMode){

const page =
document.createElement("div");

page.style.width = "794px";
page.style.background = "white";
page.style.padding = "35px";
page.style.direction = "rtl";
page.style.fontFamily = "Tahoma";

page.innerHTML = `

<div style="
border:5px solid #0b4ea2;
border-radius:25px;
padding:25px;
">

<div style="
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:30px;
">

<img src="logo.png"
style="
width:90px;
height:90px;
object-fit:contain;
">

<div style="text-align:center;flex:1;">

<h1 style="
font-size:36px;
color:#0b4ea2;
margin-bottom:10px;
">
SMOU GROUP
</h1>

<p style="
font-size:18px;
color:#555;
">
Elevator Maintenance Report
</p>

</div>

</div>

<table style="
width:100%;
border-collapse:collapse;
font-size:15px;
">

<tr>

<td style="background:#edf2f7;font-weight:bold;padding:14px;border:1px solid #333;">
رقم التقرير
</td>

<td style="padding:14px;border:1px solid #333;">
${data.reportNo}
</td>

<td style="background:#edf2f7;font-weight:bold;padding:14px;border:1px solid #333;">
التاريخ
</td>

<td style="padding:14px;border:1px solid #333;">
${data.date}
</td>

</tr>

<tr>

<td style="background:#edf2f7;font-weight:bold;padding:14px;border:1px solid #333;">
الوقت
</td>

<td style="padding:14px;border:1px solid #333;">
${data.time}
</td>

<td style="background:#edf2f7;font-weight:bold;padding:14px;border:1px solid #333;">
اسم العميل
</td>

<td style="padding:14px;border:1px solid #333;">
${data.customerName}
</td>

</tr>

<tr>

<td style="background:#edf2f7;font-weight:bold;padding:14px;border:1px solid #333;">
رقم العقد
</td>

<td style="padding:14px;border:1px solid #333;">
${data.contractNo}
</td>

<td style="background:#edf2f7;font-weight:bold;padding:14px;border:1px solid #333;">
الإمارة
</td>

<td style="padding:14px;border:1px solid #333;">
${data.emirate}
</td>

</tr>

<tr>

<td style="background:#edf2f7;font-weight:bold;padding:14px;border:1px solid #333;">
المنطقة
</td>

<td style="padding:14px;border:1px solid #333;">
${data.area}
</td>

<td style="background:#edf2f7;font-weight:bold;padding:14px;border:1px solid #333;">
اسم الفني
</td>

<td style="padding:14px;border:1px solid #333;">
${data.technician}
</td>

</tr>

<tr>

<td style="background:#edf2f7;font-weight:bold;padding:14px;border:1px solid #333;">
سبب الزيارة
</td>

<td colspan="3"
style="
padding:18px;
border:1px solid #333;
height:90px;
vertical-align:top;
">
${data.visitReason}
</td>

</tr>

<tr>

<td style="background:#edf2f7;font-weight:bold;padding:14px;border:1px solid #333;">
الإجراء المتبع
</td>

<td colspan="3"
style="
padding:18px;
border:1px solid #333;
height:90px;
vertical-align:top;
">
${data.actionTaken}
</td>

</tr>

<tr>

<td style="background:#edf2f7;font-weight:bold;padding:14px;border:1px solid #333;">
التوصيات الفنية
</td>

<td colspan="3"
style="
padding:18px;
border:1px solid #333;
height:90px;
vertical-align:top;
">
${data.recommendation}
</td>

</tr>

<tr>

<td style="background:#edf2f7;font-weight:bold;padding:14px;border:1px solid #333;">
مبلغ مطلوب
</td>

<td colspan="3"
style="
padding:18px;
border:1px solid #333;
">
${data.requiredAmount}
</td>

</tr>

</table>

<div style="
margin-top:100px;
display:flex;
justify-content:space-between;
">

<div style="
width:220px;
border-top:2px solid black;
padding-top:12px;
text-align:center;
font-weight:bold;
">
توقيع العميل
</div>

<div style="
width:220px;
border-top:2px solid black;
padding-top:12px;
text-align:center;
font-weight:bold;
">
توقيع الفني
</div>

</div>

</div>

`;

document.body.appendChild(page);

const canvas =
await html2canvas(page,{

scale:2,

backgroundColor:"#ffffff"

});

const imgData =
canvas.toDataURL("image/jpeg",1);

const { jsPDF } =
window.jspdf;

const pdf =
new jsPDF({

orientation:"portrait",

unit:"px",

format:[794,1123]

});

pdf.addImage(
imgData,
"JPEG",
0,
0,
794,
1123
);

document.body.removeChild(page);

const fileName =
"SMOU-Report-" +
data.reportNo +
".pdf";

if(shareMode){

const blob =
pdf.output("blob");

const file =
new File(
[blob],
fileName,
{type:"application/pdf"}
);

if(
navigator.canShare &&
navigator.canShare({files:[file]})
){

await navigator.share({

title:"SMOU Maintenance Report",

files:[file]

});

}else{

pdf.save(fileName);

}

}else{

pdf.save(fileName);

}

}

</script>

</body>

</html>
