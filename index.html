<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SMOU Maintenance Report</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body{
  margin:0;
  font-family:'Segoe UI',Tahoma;
  background:linear-gradient(135deg,#0b5ed7,#0a2e73);
}

.container{
  max-width:1000px;
  margin:40px auto;
  background:#fff;
  border-radius:20px;
  padding:30px;
  box-shadow:0 20px 60px rgba(0,0,0,0.25);
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.header img{height:60px;}

.title{
  font-size:22px;
  font-weight:bold;
  color:#0b5ed7;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

input,textarea,select{
  padding:14px;
  border-radius:12px;
  border:1px solid #d0dbff;
  background:#f8fbff;
}

.full{grid-column:1/-1;}

button{
  padding:14px 22px;
  border:none;
  border-radius:30px;
  margin:6px;
  font-weight:bold;
  background:#0b5ed7;
  color:#fff;
  cursor:pointer;
}

#msg{text-align:center;margin-top:15px;font-weight:bold;}
</style>
</head>

<body>

<div class="container">

<div class="header">
  <div class="title">تقرير صيانة - SMOU GROUP</div>
  <img src="logo.png">
</div>

<div class="grid">

<input id="reportNo" readonly>
<input id="date" readonly>

<input id="time" readonly>
<input id="clientName" placeholder="اسم العميل">

<input id="phone" placeholder="رقم الهاتف">
<input id="contractNo" placeholder="رقم العقد">

<input id="address" class="full" placeholder="العنوان">

<textarea id="visitReason" class="full" placeholder="سبب الزيارة"></textarea>
<textarea id="actionTaken" class="full" placeholder="الإجراء"></textarea>
<textarea id="recommendations" class="full" placeholder="التوصيات"></textarea>

<input id="amount" placeholder="المبلغ">

<select id="technician">
<option value="">اختر الفني</option>
<option>Ahmed</option>
<option>Ali</option>
<option>Mohamed</option>
</select>

</div>

<div style="text-align:center">
<button onclick="saveData()">💾 حفظ</button>
<button onclick="downloadPDF()">📄 PDF</button>
<button onclick="sendWhatsApp()">📲 واتساب</button>
</div>

<div id="msg"></div>

</div>

<!-- PDF Template -->
<div id="pdfTemplate" style="position:absolute;top:-9999px;right:-9999px;direction:rtl">

<div style="width:800px;padding:30px">

  <div style="display:flex;justify-content:space-between;border-bottom:2px solid #0b5ed7">
    <img src="logo.png" style="height:60px">
    <h2>تقرير صيانة</h2>
  </div>

  <p>رقم التقرير: <span id="p_report"></span></p>
  <p>التاريخ: <span id="p_date"></span></p>
  <p>الوقت: <span id="p_time"></span></p>

  <p>العميل: <span id="p_name"></span></p>
  <p>الهاتف: <span id="p_phone"></span></p>

  <p>سبب الزيارة: <span id="p_reason"></span></p>
  <p>الإجراء: <span id="p_action"></span></p>
  <p>التوصيات: <span id="p_rec"></span></p>

  <p>المبلغ: <span id="p_amount"></span></p>

</div>
</div>

<script>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwAiyuBL2nEcXishWBMfIKaDy5QJbjD-4kxSAja2AH8BBTO3lxjcDrNLu-SldP6Pc_1Rg/exec";

/* تحميل */
window.onload = function(){
  let last = localStorage.getItem("reportNo") || 0;
  last++;
  localStorage.setItem("reportNo", last);

  reportNo.value = new Date().getFullYear()+"-"+String(last).padStart(4,"0");

  const now = new Date();
  date.value = now.toISOString().split("T")[0];
  time.value = now.getHours()+":"+now.getMinutes();
};

/* حفظ */
async function saveData(){

  msg.innerText="جاري الحفظ...";

  try{
    await fetch(SCRIPT_URL,{
      method:"POST",
      mode:"no-cors",
      body: JSON.stringify({
        reportNo:reportNo.value,
        date:date.value,
        time:time.value,
        clientName:clientName.value,
        phone:phone.value,
        contractNo:contractNo.value,
        address:address.value,
        visitReason:visitReason.value,
        actionTaken:actionTaken.value,
        recommendations:recommendations.value,
        amount:amount.value,
        technician:technician.value
      })
    });

    msg.innerText="✅ تم الإرسال (راجع الشيت)";
  }catch(e){
    msg.innerText="❌ فشل الاتصال";
  }
}

/* PDF */
function downloadPDF(){

  p_report.innerText=reportNo.value;
  p_date.innerText=date.value;
  p_time.innerText=time.value;
  p_name.innerText=clientName.value;
  p_phone.innerText=phone.value;
  p_reason.innerText=visitReason.value;
  p_action.innerText=actionTaken.value;
  p_rec.innerText=recommendations.value;
  p_amount.innerText=amount.value;

  html2pdf().from(pdfTemplate).save("report.pdf");
}

/* WhatsApp */
function sendWhatsApp(){
  let text=`تقرير صيانة\n${clientName.value}\n${actionTaken.value}`;
  window.open("https://wa.me/?text="+encodeURIComponent(text));
}

</script>

</body>
</html>
