<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:'Segoe UI',Tahoma,sans-serif;
  background:
  radial-gradient(circle at top,#1c75ff,#081c4f);
  min-height:100vh;
  padding:15px;
}

.container{

  max-width:1000px;

  margin:auto;

  background:#fff;

  border-radius:25px;

  padding:25px;

  box-shadow:
  0 20px 60px rgba(0,0,0,.2);

}

.header{

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:25px;

  gap:15px;

}

.header img{

}

.title{

  font-size:28px;

  font-weight:800;

  color:#0b5ed7;

}

.grid{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:15px;

}

input,
textarea,
select{

  width:100%;

  padding:15px;

  border-radius:15px;

  border:1px solid #dce6ff;

  background:#f8fbff;

  font-size:15px;

  outline:none;

  transition:.3s;

}

input:focus,
textarea:focus,
select:focus{

  border-color:#0b5ed7;

  background:#fff;

  box-shadow:
  0 0 0 4px rgba(11,94,215,.1);

}

textarea{

  min-height:120px;

  resize:vertical;

}

.full{
  grid-column:1/-1;
}

.actions{

  margin-top:25px;

  display:flex;

  justify-content:center;

  gap:12px;

  flex-wrap:wrap;

}

button{

  padding:14px 24px;

  border:none;

  border-radius:50px;

  background:
  linear-gradient(135deg,#0b5ed7,#084298);

  color:#fff;

  font-size:15px;

  font-weight:bold;

  cursor:pointer;

  transition:.3s;

}

button:hover{
  transform:translateY(-2px);
}

#msg{

  text-align:center;

  margin-top:20px;

  font-size:18px;

  font-weight:bold;

}

.loader{

  width:50px;

  height:50px;

  border:4px solid #ddd;

  border-top:4px solid #0b5ed7;

  border-radius:50%;

  animation:spin 1s linear infinite;

  display:none;

  margin:20px auto;

}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

@media(max-width:768px){

  .grid{
    grid-template-columns:1fr;
  }

  .header{
    flex-direction:column;
    text-align:center;
  }

  button{
    width:100%;
  }

}

</style>

</head>

<script>

/* رابط Google Script */

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwrt1kHC4TRzS1lAyQfV4E0QGBP0tlnw7fbhgxqUYceO50rs8DiYs73gvCC4GQifRI5ow/exec";

/* تشغيل الصفحة */

window.onload = function(){

  let last =
  localStorage.getItem("reportNo") || 0;

  last++;

  localStorage.setItem("reportNo",last);

  document.getElementById("reportNo").value =
  new Date().getFullYear()
  + "-"
  + String(last).padStart(4,"0");

  const now = new Date();

  document.getElementById("date").value =
  now.toISOString().split("T")[0];

  document.getElementById("time").value =
  now.getHours()
  + ":"
  + String(now.getMinutes()).padStart(2,"0");

};

/* حفظ البيانات */

async function saveData(){

  loader.style.display="block";

  msg.style.color="#000";

  msg.innerText="⏳ جاري الحفظ...";

  const data = {

    reportNo:reportNo.value,
    date:date.value,
    time:time.value,
    clientName:clientName.value,
    phone:phone.value,
    contractNo:contractNo.value,
    emirate:emirate.value,
    address:address.value,
    visitReason:visitReason.value,
    actionTaken:actionTaken.value,
    recommendations:recommendations.value,
    amount:amount.value,
    technician:technician.value

  };

  try{

    const response =
    await fetch(SCRIPT_URL,{

      method:"POST",

      headers:{
        "Content-Type":"text/plain;charset=utf-8"
      },

      body:JSON.stringify(data)

    });

    const result =
    await response.json();

    loader.style.display="none";

    if(result.status==="success"){

      msg.style.color="green";

      msg.innerText=
      "✅ تم الحفظ في Google Sheet";

    }

    else{

      msg.style.color="red";

      msg.innerText=
      "❌ فشل الحفظ";

      console.log(result);

    }

  }

  catch(error){

    loader.style.display="none";

    msg.style.color="red";

    msg.innerText=
    "❌ خطأ بالاتصال";

    console.log(error);

  }

}

/* تحميل PDF */

function downloadPDF(){

  document.getElementById("pdfTemplate").style.display="block";

  p_report.innerText=reportNo.value;
  p_date.innerText=date.value;
  p_time.innerText=time.value;

  p_name.innerText=clientName.value;
  p_phone.innerText=phone.value;

  p_contract.innerText=contractNo.value;

  p_emirate.innerText=emirate.value;

  p_address.innerText=address.value;

  p_reason.innerText=visitReason.value;

  p_action.innerText=actionTaken.value;

  p_rec.innerText=recommendations.value;

  p_amount.innerText=amount.value;

  p_tech.innerText=technician.value;

  html2pdf()
  .set({

    margin:0.3,

    filename:
    "SMOU-Maintenance-Report.pdf",

    image:{
      type:'jpeg',
      quality:1
    },

    html2canvas:{
      scale:2
    },

    jsPDF:{
      unit:'in',
      format:'a4',
      orientation:'portrait'
    }

  })

  .from(document.getElementById("pdfTemplate"))

  .save()

  .then(() => {

    document.getElementById("pdfTemplate").style.display="none";

  });

}

/* واتساب */

function sendWhatsApp(){

  let text =

`📋 تقرير صيانة

رقم التقرير:
${reportNo.value}

العميل:
${clientName.value}

الإجراء:
${actionTaken.value}

الفني:
${technician.value}

SMOU GROUP`;

  window.open(

    "https://wa.me/?text="
    + encodeURIComponent(text)

  );

}

</script>
