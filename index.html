<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMOU Maintenance Report</title>

<style>
body{
  font-family:Tahoma;
  background:linear-gradient(135deg,#eaf2ff,#f8fbff);
  margin:0;
  padding:20px;
}

/* الكارت الرئيسي */
.container{
  max-width:900px;
  margin:auto;
  background:#ffffff;
  padding:30px;
  border-radius:20px;
  box-shadow:0 15px 40px rgba(11,94,215,0.15);
  border:1px solid #e3ecff;
}

/* العنوان */
h2{
  text-align:center;
  color:#0b5ed7;
  margin-bottom:20px;
  font-size:24px;
  letter-spacing:1px;
}

/* الجريد */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

/* الحقول */
input,textarea,select{
  padding:12px;
  border:1px solid #d6e2ff;
  border-radius:10px;
  width:100%;
  font-size:14px;
  background:#f9fbff;
  transition:0.3s;
}

/* عند التركيز */
input:focus,textarea:focus,select:focus{
  outline:none;
  border-color:#0b5ed7;
  box-shadow:0 0 0 3px rgba(11,94,215,0.1);
  background:#ffffff;
}

/* full width */
.full{
  grid-column:1/-1;
}

/* زر الحفظ */
button{
  padding:14px;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg,#0b5ed7,#3a8bff);
  color:#fff;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
  transition:0.3s;
  box-shadow:0 8px 20px rgba(11,94,215,0.3);
}

/* hover */
button:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 25px rgba(11,94,215,0.4);
}

/* رسالة */
#msg{
  text-align:center;
  margin-top:15px;
  font-weight:bold;
  font-size:14px;
}

/* ريسبونسيف */
@media(max-width:600px){
  .grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="container">

<!-- اللوجو -->
<div style="text-align:center;margin-bottom:15px">
  <img src="logo.png" style="height:70px;object-fit:contain">
</div>

<h2>تقرير صيانة - SMOU GROUP</h2>

<div class="grid">

<input id="reportNo" readonly placeholder="Report No">
<input id="date" readonly>

<input id="time" readonly>
<input id="clientName" placeholder="اسم العميل">

<input id="phone" placeholder="رقم الهاتف">
<input id="contractNo" placeholder="رقم العقد">

<input id="address" class="full" placeholder="العنوان">

<textarea id="visitReason" class="full" placeholder="سبب الزيارة"></textarea>
<textarea id="actionTaken" class="full" placeholder="الإجراء"></textarea>
<textarea id="recommendations" class="full" placeholder="التوصيات"></textarea>

<input id="amount" placeholder="المبلغ">
<select id="technician">
<option value="">اختر الفني</option>
<option>Ahmed</option>
<option>Ali</option>
<option>Mohamed</option>
</select>

</div>

<br>
<button onclick="saveData()">💾 حفظ في Google Sheet</button>

<div id="msg"></div>

</div>

<script>
const SCRIPT_URL = "PUT_YOUR_SCRIPT_URL_HERE";

/* تشغيل الصفحة */
window.onload = function(){
  generateReportNo();
  setAutoDateTime();
};

/* رقم التقرير */
function generateReportNo(){
  let last = localStorage.getItem("reportNo") || 0;
  last++;
  localStorage.setItem("reportNo", last);

  const year = new Date().getFullYear();
  document.getElementById("reportNo").value =
    year + "-" + String(last).padStart(4,"0");
}

/* التاريخ والوقت */
function setAutoDateTime(){
  const now = new Date();
  document.getElementById("date").value = now.toISOString().split("T")[0];
  document.getElementById("time").value =
    now.getHours().toString().padStart(2,"0") + ":" +
    now.getMinutes().toString().padStart(2,"0");
}

/* حفظ */
async function saveData(){

  const data = {
    reportNo: reportNo.value,
    date: date.value,
    time: time.value,
    clientName: clientName.value,
    phone: phone.value,
    contractNo: contractNo.value,
    address: address.value,
    visitReason: visitReason.value,
    actionTaken: actionTaken.value,
    recommendations: recommendations.value,
    amount: amount.value,
    technician: technician.value
  };

  if(!data.clientName || !data.technician){
    msg.innerText = "❗ ادخل اسم العميل والفني";
    return;
  }

  msg.innerText = "جاري الحفظ...";

  try{
    const res = await fetch(SCRIPT_URL,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(data)
    });

    const result = await res.json();

    if(result.status === "success"){
      msg.innerText = "✅ تم الحفظ بنجاح";
      setTimeout(()=>location.reload(),1000);
    }else{
      msg.innerText = "❌ فشل الحفظ";
    }

  }catch(e){
    msg.innerText = "❌ خطأ في الاتصال";
  }  
}
</script>

</body>
</html>
