<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMOU Maintenance Report</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body{
  margin:0;
  font-family:'Segoe UI',Tahoma;
  background:linear-gradient(135deg,#0b5ed7,#0a2e73);
}

/* Container */
.container{
  max-width:1000px;
  margin:40px auto;
  background:#ffffff;
  border-radius:20px;
  padding:30px;
  box-shadow:0 20px 60px rgba(0,0,0,0.25);
}

/* Header */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.header img{
  height:60px;
}

.title{
  font-size:22px;
  font-weight:bold;
  color:#0b5ed7;
}

/* Grid */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

input,textarea,select{
  padding:14px;
  border-radius:12px;
  border:1px solid #d0dbff;
  background:#f8fbff;
  font-size:14px;
  transition:0.3s;
}

input:focus,textarea:focus{
  border-color:#0b5ed7;
  background:#fff;
  box-shadow:0 0 0 3px rgba(11,94,215,0.1);
}

.full{
  grid-column:1/-1;
}

/* Buttons */
.buttons{
  text-align:center;
  margin-top:20px;
}

button{
  padding:14px 22px;
  border:none;
  border-radius:30px;
  margin:6px;
  font-weight:bold;
  cursor:pointer;
  background:linear-gradient(135deg,#0b5ed7,#3a8bff);
  color:#fff;
  box-shadow:0 10px 25px rgba(11,94,215,0.4);
  transition:0.3s;
}

button:hover{
  transform:translateY(-2px);
}

/* Message */
#msg{
  text-align:center;
  margin-top:15px;
  font-weight:bold;
}

/* Responsive */
@media(max-width:700px){
  .grid{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<div class="container">

<div class="header">
  <div class="title">تقرير صيانة - SMOU GROUP</div>
  <img src="logo.png">
</div>

<div class="grid">

<input id="reportNo" readonly placeholder="Report No">
<input id="date" readonly>

<input id="time" readonly>
<input id="clientName" placeholder="اسم العميل">

<input id="phone" placeholder="رقم الهاتف">
<input id="contractNo" placeholder="رقم العقد">

<input id="address" class="full" placeholder="العنوان">

<textarea id="visitReason" class="full" placeholder="سبب الزيارة"></textarea>
<textarea id="actionTaken" class="full" placeholder="الإجراء"></textarea>
<textarea id="recommendations" class="full" placeholder="التوصيات"></textarea>

<input id="amount" placeholder="المبلغ">

<select id="technician">
<option value="">اختر الفني</option>
<option>Ahmed</option>
<option>Ali</option>
<option>Mohamed</option>
</select>

</div>

<div class="buttons">
<button onclick="saveData()">💾 حفظ</button>
<button onclick="downloadPDF()">📄 تصدير PDF</button>
<button onclick="sendWhatsApp()">📲 إرسال واتساب</button>
</div>

<div id="msg"></div>

</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyeXm1yoSuHAuPciH52osmQHeHZ7j54eCsJw3cyVznG1hx67LImqOJqauLs8nfnUlbKlw/exec";

/* تشغيل الصفحة */
window.onload = function(){
  let last = localStorage.getItem("reportNo") || 0;
  last++;
  localStorage.setItem("reportNo", last);

  reportNo.value = new Date().getFullYear()+"-"+String(last).padStart(4,"0");

  const now = new Date();
  date.value = now.toISOString().split("T")[0];
  time.value = now.getHours().toString().padStart(2,"0")+":"+now.getMinutes().toString().padStart(2,"0");
};

/* حفظ */
async function saveData(){

  if(!clientName.value || !technician.value){
    msg.innerText = "❗ ادخل اسم العميل والفني";
    return;
  }

  msg.innerText = "⏳ جاري الحفظ...";

  try{
    await fetch(SCRIPT_URL,{
      method:"POST",
      mode:"no-cors",
      headers:{
        "Content-Type":"application/json"
      },
      body: JSON.stringify({
        reportNo:reportNo.value,
        date:date.value,
        time:time.value,
        clientName:clientName.value,
        phone:phone.value,
        contractNo:contractNo.value,
        address:address.value,
        visitReason:visitReason.value,
        actionTaken:actionTaken.value,
        recommendations:recommendations.value,
        amount:amount.value,
        technician:technician.value
      })
    });

    msg.innerText = "✅ تم الحفظ بنجاح";
  }catch(e){
    msg.innerText = "❌ خطأ في الاتصال";
  }
}

/* PDF */
function downloadPDF(){
  const element = document.querySelector(".container");

  const opt = {
    margin:0.5,
    filename:"SMOU_Report_"+reportNo.value+".pdf",
    image:{type:'jpeg',quality:1},
    html2canvas:{scale:2},
    jsPDF:{unit:'in',format:'a4'}
  };

  html2pdf().set(opt).from(element).save();
}

/* WhatsApp */
function sendWhatsApp(){
  let text = `
📋 تقرير صيانة - SMOU GROUP

رقم التقرير: ${reportNo.value}
التاريخ: ${date.value}
الوقت: ${time.value}

العميل: ${clientName.value}
الهاتف: ${phone.value}
العقد: ${contractNo.value}

العنوان:
${address.value}

الإجراء:
${actionTaken.value}

المبلغ: ${amount.value}
الفني: ${technician.value}
`;

  window.open("https://wa.me/?text="+encodeURIComponent(text));
}
</script>

</body>
</html>
