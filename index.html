<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SMOU GROUP - Maintenance Report</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Tahoma,Arial;
  background:#0b1f44;
  padding:15px;
}

.container{
  max-width:900px;
  margin:auto;
  background:white;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.header{
  background:#0b3b82;
  color:white;
  padding:20px;
  text-align:center;
}

.header h1{
  margin:0;
  font-size:28px;
}

.header p{
  margin-top:5px;
  font-size:14px;
}

.title{
  padding:15px;
  text-align:center;
  background:#f1f5f9;
  font-size:22px;
  font-weight:bold;
  color:#0b3b82;
}

form{
  padding:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
}

.field label{
  display:block;
  margin-bottom:5px;
  font-weight:bold;
  color:#334155;
}

input,
textarea,
select{
  width:100%;
  padding:12px;
  border:1px solid #cbd5e1;
  border-radius:12px;
  font-size:15px;
  background:#f8fafc;
}

textarea{
  resize:none;
  min-height:100px;
}

.buttons{
  margin-top:20px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:10px;
}

button{
  border:none;
  padding:15px;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  color:white;
  cursor:pointer;
}

.save-btn{
  background:#15803d;
}

.pdf-btn{
  background:#0b3b82;
}

.close-btn{
  background:#dc2626;
}

#msg{
  margin-top:15px;
  text-align:center;
  font-weight:bold;
  color:#0b3b82;
}

table{
  width:100%;
  border-collapse:collapse;
}

table th,
table td{
  border:1px solid #000;
  padding:10px;
  font-size:14px;
}

table th{
  background:#e2e8f0;
}

</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>SMOU GROUP</h1>
<p>Maintenance Report System</p>
</div>

<div class="title">
تقرير صيانة المصاعد | Elevator Maintenance Report
</div>

<form id="form">

<div class="grid">

<div class="field">
<label>رقم التقرير | Report No</label>
<input type="text" name="reportNo" id="reportNo" readonly>
</div>

<div class="field">
<label>التاريخ | Date</label>
<input type="text" name="date" id="date" readonly>
</div>

<div class="field">
<label>الساعة | Time</label>
<input type="text" name="time" id="time" readonly>
</div>

<div class="field">
<label>اسم العميل | Customer Name</label>
<input type="text" name="customerName">
</div>

<div class="field">
<label>رقم العقد | Contract No</label>
<input type="text" name="contractNo">
</div>

<div class="field">
<label>الإمارة | Emirate</label>

<select name="emirate">

<option value="">اختر الإمارة</option>

<option>ابوظبي - Abu Dhabi</option>
<option>العين - Al Ain</option>
<option>دبي - Dubai</option>
<option>الشارقة - Sharjah</option>
<option>عجمان - Ajman</option>
<option>راس الخيمة - RAK</option>
<option>ام القوين - UMQ</option>
<option>الفجيرة - Fujairah</option>
<option>الغربية - Alghrbia</option>

</select>

</div>

<div class="field">
<label>المنطقة | Area</label>
<input type="text" name="area">
</div>

<div class="field">
<label>سبب الزيارة | Reason of Visit</label>
<textarea name="visitReason"></textarea>
</div>

<div class="field">
<label>الإجراء المتبع | Action Taken</label>
<textarea name="actionTaken"></textarea>
</div>

<div class="field">
<label>التوصيات الفنية | Technical Recommendations</label>
<textarea name="recommendation"></textarea>
</div>

<div class="field">
<label>مبلغ مطلوب | Required Amount</label>
<input type="text" name="requiredAmount">
</div>

<div class="field">
<label>اسم الفني | Technician</label>

<select name="technician">

<option value="">اختر الفني</option>

<option>Hassan Taher - حسن طاهر</option>
<option>Anwar Ali - أنور علي</option>
<option>Abdulaziz Alalfi - عبدالعزيز الألفي</option>
<option>Sayed Mahmoud - السيد محمود</option>
<option>Sadiq Yousif - صديق يوسف</option>

</select>

</div>

</div>

<div class="buttons">

<button type="button" class="save-btn" onclick="saveAndSharePDF()">
حفظ البيانات + PDF
</button>

<button type="button" class="pdf-btn" onclick="downloadPDFOnly()">
تحميل PDF فقط
</button>

<button type="button" class="close-btn" onclick="window.close()">
إغلاق
</button>

</div>

<div id="msg"></div>

</form>

</div>

<script>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwnKQ9UKIRjULomlmJEv8R6rQvF75ZH0HMBdnxww_5ggxntGtluDcsIoI6KP_qziCQZ_g/exec";

function init(){

  const now = new Date();

  document.getElementById("date").value =
  now.toLocaleDateString("en-CA");

  document.getElementById("time").value =
  now.toLocaleTimeString("en-US");

  let lastNo =
  localStorage.getItem("SMOU_REPORT_NO") || 1000;

  lastNo++;

  document.getElementById("reportNo").value = lastNo;

  localStorage.setItem("SMOU_REPORT_NO", lastNo);

}

init();

function collectData(){

  const form = document.getElementById("form");

  return new FormData(form);

}

async function saveToSheet(formData){

  try{

    await fetch(SCRIPT_URL,{

      method:"POST",
      mode:"no-cors",
      body:formData

    });

    return true;

  }catch(error){

    console.error(error);

    return false;

  }

}

async function saveAndSharePDF(){

  const msg = document.getElementById("msg");

  msg.innerHTML = "جاري الحفظ وإنشاء PDF...";

  const formData = collectData();

  await saveToSheet(formData);

  const data = Object.fromEntries(formData.entries());

  await createPDF(data,"share");

  msg.innerHTML = "✔ تم الحفظ بنجاح";

}

async function downloadPDFOnly(){

  const msg = document.getElementById("msg");

  msg.innerHTML = "جاري إنشاء PDF...";

  const formData = collectData();

  const data = Object.fromEntries(formData.entries());

  await createPDF(data,"download");

  msg.innerHTML = "✔ تم تحميل PDF";

}

async function createPDF(data,mode){

  try{

    const wrapper = document.createElement("div");

    wrapper.style.background = "white";
    wrapper.style.padding = "30px";
    wrapper.style.width = "794px";

    wrapper.innerHTML = `

    <div id="pdfPage" style="font-family:Tahoma;direction:rtl;color:#111">

      <h1 style="
        text-align:center;
        color:#0b3b82;
        margin-bottom:30px;
      ">
      تقرير صيانة المصاعد
      <br>
      Elevator Maintenance Report
      </h1>

      <table>

      <tr>
      <th>رقم التقرير</th>
      <td>${data.reportNo || ""}</td>

      <th>التاريخ</th>
      <td>${data.date || ""}</td>
      </tr>

      <tr>
      <th>الساعة</th>
      <td>${data.time || ""}</td>

      <th>اسم العميل</th>
      <td>${data.customerName || ""}</td>
      </tr>

      <tr>
      <th>رقم العقد</th>
      <td>${data.contractNo || ""}</td>

      <th>الإمارة</th>
      <td>${data.emirate || ""}</td>
      </tr>

      <tr>
      <th>المنطقة</th>
      <td>${data.area || ""}</td>

      <th>اسم الفني</th>
      <td>${data.technician || ""}</td>
      </tr>

      <tr>
      <th>سبب الزيارة</th>
      <td colspan="3">
      ${data.visitReason || ""}
      </td>
      </tr>

      <tr>
      <th>الإجراء المتبع</th>
      <td colspan="3">
      ${data.actionTaken || ""}
      </td>
      </tr>

      <tr>
      <th>التوصيات الفنية</th>
      <td colspan="3">
      ${data.recommendation || ""}
      </td>
      </tr>

      <tr>
      <th>مبلغ مطلوب</th>
      <td colspan="3">
      ${data.requiredAmount || ""}
      </td>
      </tr>

      </table>

      <div style="
      margin-top:80px;
      display:flex;
      justify-content:space-between;
      font-size:14px;
      ">

      <div>
      توقيع الفني
      </div>

      <div>
      توقيع العميل
      </div>

      </div>

    </div>

    `;

    document.body.appendChild(wrapper);

    const canvas = await html2canvas(wrapper,{

      scale:2,
      useCORS:true

    });

    const imgData = canvas.toDataURL("image/jpeg",1);

    const { jsPDF } = window.jspdf;

    const pdf = new jsPDF({

      orientation:"portrait",
      unit:"px",
      format:[794,1123]

    });

    pdf.addImage(imgData,"JPEG",0,0,794,1123);

    document.body.removeChild(wrapper);

    const fileName =
    "Maintenance-Report-" + data.reportNo + ".pdf";

    if(mode === "download"){

      pdf.save(fileName);

    }else{

      const pdfBlob = pdf.output("blob");

      const file = new File(
        [pdfBlob],
        fileName,
        {type:"application/pdf"}
      );

      if(
        navigator.canShare &&
        navigator.canShare({files:[file]})
      ){

        await navigator.share({

          title:"Maintenance Report",

          files:[file]

        });

      }else{

        pdf.save(fileName);

      }

    }

  }catch(error){

    console.error(error);

    document.getElementById("msg").innerHTML =
    "❌ حدث خطأ أثناء إنشاء PDF";

  }

}

</script>

</body>
</html>
