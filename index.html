<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMOU Maintenance Report</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body{
  margin:0;
  font-family:'Segoe UI',Tahoma;
  background:linear-gradient(135deg,#0b5ed7,#0a2e73);
}

/* Container */
.container{
  max-width:1000px;
  margin:40px auto;
  background:#fff;
  border-radius:20px;
  padding:30px;
  box-shadow:0 20px 60px rgba(0,0,0,0.25);
}

/* Header */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.header img{
  height:60px;
}

.title{
  font-size:22px;
  font-weight:bold;
  color:#0b5ed7;
}

/* Grid */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

input,textarea,select{
  padding:14px;
  border-radius:12px;
  border:1px solid #d0dbff;
  background:#f8fbff;
  font-size:14px;
}

input:focus,textarea:focus{
  border-color:#0b5ed7;
  background:#fff;
}

.full{
  grid-column:1/-1;
}

/* Buttons */
.buttons{
  text-align:center;
  margin-top:20px;
}

button{
  padding:14px 22px;
  border:none;
  border-radius:30px;
  margin:6px;
  font-weight:bold;
  cursor:pointer;
  background:linear-gradient(135deg,#0b5ed7,#3a8bff);
  color:#fff;
}

#msg{
  text-align:center;
  margin-top:15px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
  <div class="title">تقرير صيانة - SMOU GROUP</div>
  <img src="logo.png">
</div>

<div class="grid">

<input id="reportNo" readonly>
<input id="date" readonly>

<input id="time" readonly>
<input id="clientName" placeholder="اسم العميل">

<input id="phone" placeholder="رقم الهاتف">
<input id="contractNo" placeholder="رقم العقد">

<input id="address" class="full" placeholder="العنوان">

<textarea id="visitReason" class="full" placeholder="سبب الزيارة"></textarea>
<textarea id="actionTaken" class="full" placeholder="الإجراء"></textarea>
<textarea id="recommendations" class="full" placeholder="التوصيات"></textarea>

<input id="amount" placeholder="المبلغ">

<select id="technician">
<option value="">اختر الفني</option>
<option>Ahmed</option>
<option>Ali</option>
<option>Mohamed</option>
</select>

</div>

<div class="buttons">
<button onclick="saveData()">💾 حفظ</button>
<button onclick="downloadPDF()">📄 PDF</button>
<button onclick="sendWhatsApp()">📲 واتساب</button>
</div>

<div id="msg"></div>

</div>

<!-- PDF Template -->
<div id="pdfTemplate" style="display:none;direction:rtl;font-family:Tajawal">

  <div style="padding:30px">

    <div style="display:flex;justify-content:space-between;align-items:center">
      <img src="logo.png" style="height:60px">
      <h2 style="color:#0b5ed7">تقرير صيانة</h2>
    </div>

    <hr>

    <h3>بيانات التقرير</h3>
    <p><b>رقم التقرير:</b> <span id="p_report"></span></p>
    <p><b>التاريخ:</b> <span id="p_date"></span></p>
    <p><b>الوقت:</b> <span id="p_time"></span></p>

    <h3>بيانات العميل</h3>
    <p><b>الاسم:</b> <span id="p_name"></span></p>
    <p><b>الهاتف:</b> <span id="p_phone"></span></p>

    <h3>تفاصيل العمل</h3>
    <p><b>سبب الزيارة:</b><br><span id="p_reason"></span></p>
    <p><b>الإجراء:</b><br><span id="p_action"></span></p>
    <p><b>التوصيات:</b><br><span id="p_rec"></span></p>

    <h3>البيانات المالية</h3>
    <p><b>المبلغ:</b> <span id="p_amount"></span></p>

    <br><br>

    <div style="display:flex;justify-content:space-between">
      <div>توقيع الفني: __________</div>
      <div>توقيع العميل: __________</div>
    </div>

  </div>

</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwAiyuBL2nEcXishWBMfIKaDy5QJbjD-4kxSAja2AH8BBTO3lxjcDrNLu-SldP6Pc_1Rg/exec";

/* تشغيل الصفحة */
window.onload = function(){
  let last = localStorage.getItem("reportNo") || 0;
  last++;
  localStorage.setItem("reportNo", last);

  reportNo.value = new Date().getFullYear()+"-"+String(last).padStart(4,"0");

  const now = new Date();
  date.value = now.toISOString().split("T")[0];
  time.value = now.getHours()+":"+now.getMinutes();
};

/* حفظ */
async function saveData(){

  if(!clientName.value || !technician.value){
    msg.innerText = "❗ ادخل اسم العميل والفني";
    return;
  }

  msg.innerText = "⏳ جاري الحفظ...";

  try{
    const res = await fetch(SCRIPT_URL,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        reportNo:reportNo.value,
        date:date.value,
        time:time.value,
        clientName:clientName.value,
        phone:phone.value,
        contractNo:contractNo.value,
        address:address.value,
        visitReason:visitReason.value,
        actionTaken:actionTaken.value,
        recommendations:recommendations.value,
        amount:amount.value,
        technician:technician.value
      })
    });

    const result = await res.json();

    if(result.status === "success"){
      msg.innerText = "✅ تم الحفظ في Google Sheet";
    }else{
      msg.innerText = "❌ فشل الحفظ";
    }

  }catch(e){
    msg.innerText = "❌ خطأ في الاتصال";
  }
}

/* PDF احترافي */
function downloadPDF(){

  document.getElementById("p_report").innerText = reportNo.value;
  document.getElementById("p_date").innerText = date.value;
  document.getElementById("p_time").innerText = time.value;
  document.getElementById("p_name").innerText = clientName.value;
  document.getElementById("p_phone").innerText = phone.value;
  document.getElementById("p_reason").innerText = visitReason.value;
  document.getElementById("p_action").innerText = actionTaken.value;
  document.getElementById("p_rec").innerText = recommendations.value;
  document.getElementById("p_amount").innerText = amount.value;

  html2pdf().set({
    margin:0.5,
    filename:"SMOU_Report_"+reportNo.value+".pdf",
    html2canvas:{scale:2},
    jsPDF:{unit:'in',format:'a4'}
  }).from(document.getElementById("pdfTemplate")).save();
}

/* واتساب */
function sendWhatsApp(){
  let text = `
📋 تقرير صيانة - SMOU GROUP

رقم التقرير: ${reportNo.value}
العميل: ${clientName.value}
الهاتف: ${phone.value}

الإجراء:
${actionTaken.value}

المبلغ: ${amount.value}
الفني: ${technician.value}
`;

  window.open("https://wa.me/?text="+encodeURIComponent(text));
}
</script>

</body>
</html>
