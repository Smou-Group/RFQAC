<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMOU Maintenance Report</title>

<!-- PDF Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body{
  font-family:Tahoma;
  background:linear-gradient(135deg,#eaf2ff,#f8fbff);
  margin:0;
  padding:20px;
}

.container{
  max-width:900px;
  margin:auto;
  background:#ffffff;
  padding:30px;
  border-radius:20px;
  box-shadow:0 15px 40px rgba(11,94,215,0.15);
  border:1px solid #e3ecff;
}

h2{
  text-align:center;
  color:#0b5ed7;
  margin-bottom:20px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

input,textarea,select{
  padding:12px;
  border:1px solid #d6e2ff;
  border-radius:10px;
  width:100%;
  background:#f9fbff;
}

input:focus,textarea:focus,select:focus{
  outline:none;
  border-color:#0b5ed7;
  box-shadow:0 0 0 3px rgba(11,94,215,0.1);
  background:#fff;
}

.full{
  grid-column:1/-1;
}

button{
  padding:14px;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg,#0b5ed7,#3a8bff);
  color:#fff;
  font-weight:bold;
  cursor:pointer;
  margin:5px;
  box-shadow:0 8px 20px rgba(11,94,215,0.3);
  transition:.3s;
}

button:hover{
  transform:translateY(-2px);
}

#msg{
  text-align:center;
  margin-top:15px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<div style="text-align:center;margin-bottom:15px">
  <img src="logo.png" style="height:70px">
</div>

<h2>تقرير صيانة - SMOU GROUP</h2>

<div class="grid">

<input id="reportNo" readonly placeholder="Report No">
<input id="date" readonly>

<input id="time" readonly>
<input id="clientName" placeholder="اسم العميل">

<input id="phone" placeholder="رقم الهاتف">
<input id="contractNo" placeholder="رقم العقد">

<input id="address" class="full" placeholder="العنوان">

<textarea id="visitReason" class="full" placeholder="سبب الزيارة"></textarea>
<textarea id="actionTaken" class="full" placeholder="الإجراء"></textarea>
<textarea id="recommendations" class="full" placeholder="التوصيات"></textarea>

<input id="amount" placeholder="المبلغ">

<select id="technician">
<option value="">اختر الفني</option>
<option>Ahmed</option>
<option>Ali</option>
<option>Mohamed</option>
</select>

</div>

<br>

<button onclick="saveData()">💾 حفظ في Google Sheet</button>
<button onclick="downloadPDF()">📄 تصدير PDF</button>
<button onclick="sendWhatsApp()">📲 إرسال واتساب</button>

<div id="msg"></div>

</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyeXm1yoSuHAuPciH52osmQHeHZ7j54eCsJw3cyVznG1hx67LImqOJqauLs8nfnUlbKlw/exec";

/* تشغيل الصفحة */
window.onload = function(){
  generateReportNo();
  setAutoDateTime();
};

/* رقم التقرير */
function generateReportNo(){
  let last = localStorage.getItem("reportNo") || 0;
  last++;
  localStorage.setItem("reportNo", last);

  const year = new Date().getFullYear();
  reportNo.value = year + "-" + String(last).padStart(4,"0");
}

/* التاريخ والوقت */
function setAutoDateTime(){
  const now = new Date();
  date.value = now.toISOString().split("T")[0];
  time.value =
    now.getHours().toString().padStart(2,"0") + ":" +
    now.getMinutes().toString().padStart(2,"0");
}

/* حفظ البيانات */
async function saveData(){

  const data = {
    reportNo: reportNo.value,
    date: date.value,
    time: time.value,
    clientName: clientName.value,
    phone: phone.value,
    contractNo: contractNo.value,
    address: address.value,
    visitReason: visitReason.value,
    actionTaken: actionTaken.value,
    recommendations: recommendations.value,
    amount: amount.value,
    technician: technician.value
  };

  if(!data.clientName || !data.technician){
    msg.innerText = "❗ ادخل اسم العميل والفني";
    return;
  }

  msg.innerText = "⏳ جاري الحفظ...";

  try{
    const res = await fetch(SCRIPT_URL,{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body: JSON.stringify(data)
    });

    const result = await res.json();

    if(result.status === "success"){
      msg.innerText = "✅ تم الحفظ في Google Sheet";
      setTimeout(()=>location.reload(),1000);
    }else{
      msg.innerText = "❌ فشل الحفظ";
    }

  }catch(e){
    console.error(e);
    msg.innerText = "❌ خطأ في الاتصال";
  }
}

/* تصدير PDF */
function downloadPDF(){
  const element = document.querySelector(".container");

  const opt = {
    margin:0.5,
    filename:'SMOU_Report_'+reportNo.value+'.pdf',
    image:{type:'jpeg',quality:1},
    html2canvas:{scale:2},
    jsPDF:{unit:'in',format:'a4',orientation:'portrait'}
  };

  html2pdf().set(opt).from(element).save();
}

/* واتساب */
function sendWhatsApp(){
  let text = `
📋 تقرير صيانة - SMOU GROUP

رقم التقرير: ${reportNo.value}
التاريخ: ${date.value}
الوقت: ${time.value}

العميل: ${clientName.value}
الهاتف: ${phone.value}
العقد: ${contractNo.value}

العنوان:
${address.value}

سبب الزيارة:
${visitReason.value}

الإجراء:
${actionTaken.value}

التوصيات:
${recommendations.value}

المبلغ: ${amount.value}
الفني: ${technician.value}
`;

  window.open("https://wa.me/?text=" + encodeURIComponent(text));
}
</script>

</body>
</html>
