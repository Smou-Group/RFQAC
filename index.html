<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SMOU GROUP - Maintenance Report</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Times New Roman',serif;
background:#081a35;
padding:10px;
}

.container{
width:100%;
max-width:900px;
margin:auto;
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 35px rgba(0,0,0,.3);
}

.header{
background:linear-gradient(135deg,#05204a,#0b4ea2);
padding:22px;
text-align:center;
color:white;
}

.logo{
width:80px;
height:80px;
object-fit:contain;
background:white;
padding:6px;
border-radius:18px;
margin-bottom:8px;
}

.header h1{
font-size:28px;
margin-bottom:5px;
}

.header p{
font-size:14px;
opacity:.9;
}

.title{
padding:15px;
background:#f1f5f9;
text-align:center;
font-size:20px;
font-weight:bold;
color:#0b3b82;
}

form{
padding:16px;
}

.grid{
display:grid;
grid-template-columns:1fr;
gap:12px;
}

@media(min-width:700px){

.grid{
grid-template-columns:1fr 1fr;
}

.buttons{
grid-template-columns:1fr 1fr 1fr;
}

}

.field label{
display:block;
margin-bottom:5px;
font-size:13px;
font-weight:bold;
color:#334155;
}

input,
textarea,
select{
width:100%;
padding:14px;
border-radius:12px;
border:1px solid #dbe3ef;
background:#f8fafc;
font-size:15px;
outline:none;
font-family:'Times New Roman',serif;
}

textarea{
resize:none;
min-height:100px;
}

.buttons{
display:grid;
grid-template-columns:1fr;
gap:10px;
margin-top:18px;
}

button{
border:none;
padding:15px;
font-size:15px;
font-weight:bold;
border-radius:14px;
color:white;
cursor:pointer;
font-family:'Times New Roman',serif;
}

.save-btn{
background:#16a34a;
}

.pdf-btn{
background:#0b4ea2;
}

.close-btn{
background:#dc2626;
}

#msg{
margin-top:12px;
text-align:center;
font-weight:bold;
font-size:14px;
color:#0b3b82;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<img src="logo.png" class="logo">

<h1>SMOU GROUP</h1>

<p>Elevators & Air Conditioning</p>

</div>

<div class="title">

تقرير صيانة المصاعد
<br>
Elevator Maintenance Report

</div>

<form id="form">

<div class="grid">

<div class="field">
<label>رقم التقرير | Report No</label>
<input type="text" id="reportNo" name="reportNo" readonly>
</div>

<div class="field">
<label>التاريخ | Date</label>
<input type="text" id="date" name="date" readonly>
</div>

<div class="field">
<label>الوقت | Time</label>
<input type="text" id="time" name="time" readonly>
</div>

<div class="field">
<label>اسم العميل | Customer Name</label>
<input type="text" name="customerName">
</div>

<div class="field">
<label>رقم العقد | Contract No</label>
<input type="text" name="contractNo">
</div>

<div class="field">

<label>الإمارة | Emirate</label>

<select name="emirate">

<option value="">اختر الإمارة</option>

<option>ابوظبي - Abu Dhabi</option>
<option>العين - Al Ain</option>
<option>دبي - Dubai</option>
<option>الشارقة - Sharjah</option>
<option>عجمان - Ajman</option>
<option>راس الخيمة - RAK</option>
<option>ام القوين - UMQ</option>
<option>الفجيرة - Fujairah</option>
<option>الغربية - Alghrbia</option>

</select>

</div>

<div class="field">
<label>المنطقة | Area</label>
<input type="text" name="area">
</div>

<div class="field">
<label>سبب الزيارة | Reason of Visit</label>
<textarea name="visitReason"></textarea>
</div>

<div class="field">
<label>الإجراء المتبع | Action Taken</label>
<textarea name="actionTaken"></textarea>
</div>

<div class="field">
<label>التوصيات الفنية | Technical Recommendation</label>
<textarea name="recommendation"></textarea>
</div>

<div class="field">
<label>مبلغ مطلوب | Required Amount</label>
<input type="text" name="requiredAmount">
</div>

<div class="field">

<label>اسم الفني | Technician</label>

<select name="technician">

<option value="">اختر الفني</option>

<option>Hassan Taher - حسن طاهر</option>
<option>Anwar Ali - أنور علي</option>
<option>Abdulaziz Alalfi - عبدالعزيز الألفي</option>
<option>Sayed Mahmoud - السيد محمود</option>
<option>Sadiq Yousif - صديق يوسف</option>

</select>

</div>

</div>

<div class="buttons">

<button
type="button"
class="save-btn"
onclick="saveAndSharePDF()">

حفظ البيانات + PDF

</button>

<button
type="button"
class="pdf-btn"
onclick="downloadPDFOnly()">

تحميل PDF فقط

</button>

<button
type="button"
class="close-btn"
onclick="window.close()">

إغلاق

</button>

</div>

<div id="msg"></div>

</form>

</div>

<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwHKjkD6SguDMOiPlhepYB7dUHK2KZxLVeizmgDkBUc0iSGcUHSaFmms6xFP3ImtiIvGw/exec";

function init(){

const now = new Date();

date.value =
now.toLocaleDateString("en-CA");

time.value =
now.toLocaleTimeString("en-US");

let lastNo =
localStorage.getItem("SMOU_REPORT_NO") || 2605000;

lastNo++;

reportNo.value = lastNo;

localStorage.setItem("SMOU_REPORT_NO",lastNo);

}

init();

function getData(){

const form =
document.getElementById("form");

const formData =
new FormData(form);

return Object.fromEntries(formData.entries());

}

async function saveData(data){

try{

await fetch(SCRIPT_URL,{

method:"POST",

mode:"no-cors",

body:JSON.stringify(data)

});

return true;

}catch(error){

console.error(error);

return false;

}

}

async function saveAndSharePDF(){

msg.innerHTML =
"جاري الحفظ وإنشاء PDF...";

const data =
getData();

await saveData(data);

await createPDF(data,true);

msg.innerHTML =
"✔ تم الحفظ بنجاح";

}

async function downloadPDFOnly(){

msg.innerHTML =
"جاري إنشاء PDF...";

const data =
getData();

await createPDF(data,false);

msg.innerHTML =
"✔ تم تحميل PDF";

}

async function createPDF(data,shareMode){

const page =
document.createElement("div");

page.style.width = "794px";
page.style.background = "#f5f7fb";
page.style.padding = "35px";
page.style.fontFamily = "'Times New Roman', serif";
page.style.direction = "rtl";
page.style.display = "flex";
page.style.justifyContent = "center";

page.innerHTML = `

<div style="
width:650px;
background:white;
border-radius:12px;
overflow:hidden;
box-shadow:0 2px 12px rgba(0,0,0,.08);
border:1px solid #dce3ec;
">

<div style="
background:#0b2f6b;
padding:20px 25px;
color:white;
display:flex;
justify-content:space-between;
align-items:center;
">

<div>

<div style="
font-size:28px;
font-weight:bold;
margin-bottom:4px;
">
SMOU GROUP
</div>

<div style="
font-size:13px;
opacity:.9;
">
Elevators & Air Conditioning
</div>

</div>

<div style="text-align:center;">

<div style="
font-size:24px;
font-weight:bold;
">
تقرير صيانة
</div>

<div style="
font-size:16px;
">
Maintenance Report
</div>

</div>

<img src="logo.png"
style="
width:65px;
height:65px;
background:white;
padding:5px;
border-radius:50%;
object-fit:contain;
">

</div>

<div style="padding:20px;">

<table style="
width:100%;
border-collapse:collapse;
font-size:12pt;
font-family:'Times New Roman',serif;
">

<tr>

${cellTitle("رقم التقرير")}
${cellData(data.reportNo)}

${cellTitle("التاريخ")}
${cellData(data.date)}

</tr>

<tr>

${cellTitle("الوقت")}
${cellData(data.time)}

${cellTitle("اسم العميل")}
${cellData(data.customerName)}

</tr>

<tr>

${cellTitle("رقم العقد")}
${cellData(data.contractNo)}

${cellTitle("الإمارة")}
${cellData(data.emirate)}

</tr>

<tr>

${cellTitle("المنطقة")}
${cellData(data.area)}

${cellTitle("اسم الفني")}
${cellData(data.technician)}

</tr>

</table>

${sectionBlock(
"سبب الزيارة | Reason of Visit",
data.visitReason
)}

${sectionBlock(
"الإجراء المتبع | Action Taken",
data.actionTaken
)}

${sectionBlock(
"التوصيات الفنية | Technical Recommendation",
data.recommendation
)}

<div style="
margin-top:18px;
border:2px solid #0b2f6b;
border-radius:10px;
padding:16px;
display:flex;
justify-content:space-between;
align-items:center;
background:#f8fbff;
">

<div style="
font-size:18px;
font-weight:bold;
color:#0b2f6b;
">
مبلغ مطلوب
</div>

<div style="
font-size:20px;
font-weight:bold;
color:#111;
">
${data.requiredAmount || "0"} AED
</div>

</div>

<div style="
display:flex;
justify-content:space-between;
margin-top:70px;
">

<div style="
width:220px;
text-align:center;
">

<div style="
border-top:1.5px solid #444;
padding-top:8px;
font-size:13pt;
font-weight:bold;
">
توقيع العميل
<br>
Customer Signature
</div>

</div>

<div style="
width:220px;
text-align:center;
">

<div style="
border-top:1.5px solid #444;
padding-top:8px;
font-size:13pt;
font-weight:bold;
">
توقيع الفني
<br>
Technician Signature
</div>

</div>

</div>

</div>

</div>

`;

document.body.appendChild(page);

const canvas =
await html2canvas(page,{

scale:2,
backgroundColor:"#f5f7fb"

});

const imgData =
canvas.toDataURL("image/jpeg",1);

const { jsPDF } =
window.jspdf;

const pdf =
new jsPDF({

orientation:"portrait",
unit:"px",
format:"a4"

});

pdf.addImage(
imgData,
"JPEG",
20,
20,
555,
785
);

document.body.removeChild(page);

const fileName =
"SMOU-Report-" +
data.reportNo +
".pdf";

if(shareMode){

const blob =
pdf.output("blob");

const file =
new File(
[blob],
fileName,
{type:"application/pdf"}
);

if(
navigator.canShare &&
navigator.canShare({files:[file]})
){

await navigator.share({

title:"SMOU Maintenance Report",

files:[file]

});

}else{

pdf.save(fileName);

}

}else{

pdf.save(fileName);

}

}

function cellTitle(text){

return `

<td style="
background:#0b2f6b;
color:white;
padding:12px;
font-weight:bold;
border:1px solid #dce3ec;
width:20%;
">

${text}

</td>

`;

}

function cellData(text){

return `

<td style="
padding:12px;
border:1px solid #dce3ec;
background:white;
font-weight:bold;
width:30%;
">

${text || ""}

</td>

`;

}

function sectionBlock(title,value){

return `

<div style="
margin-top:18px;
">

<div style="
background:#eef4fb;
padding:10px 14px;
font-size:14pt;
font-weight:bold;
color:#0b2f6b;
border:1px solid #dce3ec;
border-bottom:none;
border-radius:8px 8px 0 0;
">

${title}

</div>

<div style="
min-height:90px;
padding:14px;
border:1px solid #dce3ec;
background:white;
font-size:12pt;
line-height:1.8;
border-radius:0 0 8px 8px;
">

${value || ""}

</div>

</div>

`;

}

</script>

</body>

</html>
