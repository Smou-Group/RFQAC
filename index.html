<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SMOU GROUP - Maintenance Report</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Times New Roman',serif;
background:#0b1730;
padding:15px;
}

.container{
max-width:950px;
margin:auto;
background:white;
border-radius:18px;
overflow:hidden;
box-shadow:0 12px 35px rgba(0,0,0,.25);
}

.header{
background:#0b2f6b;
padding:25px;
text-align:center;
color:white;
}

.logo{
width:85px;
height:85px;
background:white;
padding:6px;
border-radius:50%;
object-fit:contain;
margin-bottom:10px;
}

.header h1{
font-size:34px;
margin-bottom:5px;
}

.header p{
font-size:15px;
opacity:.9;
}

.title{
padding:18px;
background:#f4f7fb;
text-align:center;
font-size:24px;
font-weight:bold;
color:#0b2f6b;
line-height:1.6;
}

form{
padding:22px;
}

.grid{
display:grid;
grid-template-columns:1fr;
gap:14px;
}

@media(min-width:700px){

.grid{
grid-template-columns:1fr 1fr;
}

.buttons{
grid-template-columns:1fr 1fr 1fr;
}

}

.field label{
display:block;
margin-bottom:6px;
font-size:14px;
font-weight:bold;
color:#1e293b;
}

input,
textarea,
select{
width:100%;
padding:14px;
border-radius:10px;
border:1px solid #dbe3ef;
background:#fafcff;
font-size:15px;
outline:none;
font-family:'Times New Roman',serif;
}

textarea{
resize:none;
min-height:110px;
}

.buttons{
display:grid;
grid-template-columns:1fr;
gap:12px;
margin-top:20px;
}

button{
border:none;
padding:15px;
font-size:15px;
font-weight:bold;
border-radius:10px;
color:white;
cursor:pointer;
font-family:'Times New Roman',serif;
}

.save-btn{
background:#16a34a;
}

.pdf-btn{
background:#0b4ea2;
}

.close-btn{
background:#dc2626;
}

#msg{
margin-top:15px;
text-align:center;
font-weight:bold;
font-size:14px;
color:#0b2f6b;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<img src="logo.png" class="logo">

<h1>SMOU GROUP</h1>

<p>Elevators & Air Conditioning</p>

</div>

<div class="title">

تقرير صيانة المصاعد
<br>
Maintenance Report

</div>

<form id="form">

<div class="grid">

<div class="field">
<label>رقم التقرير | Report No</label>
<input type="text" id="reportNo" name="reportNo" readonly>
</div>

<div class="field">
<label>التاريخ | Date</label>
<input type="text" id="date" name="date" readonly>
</div>

<div class="field">
<label>الوقت | Time</label>
<input type="text" id="time" name="time" readonly>
</div>

<div class="field">
<label>اسم العميل | Customer Name</label>
<input type="text" name="customerName">
</div>

<div class="field">
<label>رقم العقد | Contract No</label>
<input type="text" name="contractNo">
</div>

<div class="field">

<label>الإمارة | Emirate</label>

<select name="emirate">

<option value="">اختر الإمارة</option>

<option>ابوظبي - Abu Dhabi</option>
<option>العين - Al Ain</option>
<option>دبي - Dubai</option>
<option>الشارقة - Sharjah</option>
<option>عجمان - Ajman</option>
<option>راس الخيمة - RAK</option>
<option>ام القوين - UMQ</option>
<option>الفجيرة - Fujairah</option>
<option>الغربية - Alghrbia</option>

</select>

</div>

<div class="field">
<label>المنطقة | Area</label>
<input type="text" name="area">
</div>

<div class="field">

<label>اسم الفني | Technician</label>

<select name="technician">

<option value="">اختر الفني</option>

<option>Hassan Taher - حسن طاهر</option>
<option>Anwar Ali - أنور علي</option>
<option>Abdulaziz Alalfi - عبدالعزيز الألفي</option>
<option>Sayed Mahmoud - السيد محمود</option>
<option>Sadiq Yousif - صديق يوسف</option>

</select>

</div>

<div class="field">
<label>سبب الزيارة | Reason of Visit</label>
<textarea name="visitReason"></textarea>
</div>

<div class="field">
<label>الإجراء المتبع | Action Taken</label>
<textarea name="actionTaken"></textarea>
</div>

<div class="field">
<label>التوصيات الفنية | Technical Recommendation</label>
<textarea name="recommendation"></textarea>
</div>

<div class="field">
<label>مبلغ مطلوب | Required Amount</label>
<input type="text" name="requiredAmount">
</div>

</div>

<div class="buttons">

<button
type="button"
class="save-btn"
onclick="saveAndCreatePDF()">

حفظ البيانات + PDF

</button>

<button
type="button"
class="pdf-btn"
onclick="downloadPDFOnly()">

تحميل PDF فقط

</button>

<button
type="button"
class="close-btn"
onclick="window.close()">

إغلاق

</button>

</div>

<div id="msg"></div>

</form>

</div>

<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwHKjkD6SguDMOiPlhepYB7dUHK2KZxLVeizmgDkBUc0iSGcUHSaFmms6xFP3ImtiIvGw/exec";

function init(){

const now = new Date();

date.value =
now.toLocaleDateString("en-CA");

time.value =
now.toLocaleTimeString("en-US");

let lastNo =
localStorage.getItem("SMOU_REPORT_NO") || 2605000;

lastNo++;

reportNo.value = lastNo;

localStorage.setItem("SMOU_REPORT_NO",lastNo);

}

init();

function getData(){

const form =
document.getElementById("form");

const formData =
new FormData(form);

return Object.fromEntries(formData.entries());

}

async function saveData(data){

try{

await fetch(SCRIPT_URL,{

method:"POST",
mode:"no-cors",
body:JSON.stringify(data)

});

return true;

}catch(error){

console.error(error);
return false;

}

}

async function saveAndCreatePDF(){

msg.innerHTML =
"جاري الحفظ وإنشاء التقرير...";

const data =
getData();

await saveData(data);

await createPDF(data,true);

msg.innerHTML =
"✔ تم إنشاء التقرير";

}

async function downloadPDFOnly(){

const data =
getData();

await createPDF(data,false);

}

async function createPDF(data,shareMode){

const { jsPDF } = window.jspdf;

const pdf = new jsPDF({
orientation:"portrait",
unit:"mm",
format:"a4"
});

const blue = [11,47,107];
const gray = [240,244,248];

pdf.setFillColor(...blue);
pdf.rect(0,0,210,32,"F");

pdf.addImage(
"logo.png",
"PNG",
12,
6,
18,
18
);

pdf.setTextColor(255,255,255);

pdf.setFont("times","bold");
pdf.setFontSize(22);

pdf.text("SMOU GROUP",38,15);

pdf.setFontSize(11);

pdf.text(
"Elevators & Air Conditioning",
38,
22
);

pdf.setFontSize(20);

pdf.text(
"Maintenance Report",
150,
16
);

pdf.setFontSize(12);

pdf.text(
"تقرير صيانة المصاعد",
150,
23
);

pdf.setTextColor(0,0,0);

pdf.setDrawColor(220,227,236);

let y = 42;

drawInfoRow(
"رقم التقرير",
data.reportNo,
"التاريخ",
data.date
);

drawInfoRow(
"الوقت",
data.time,
"اسم العميل",
data.customerName
);

drawInfoRow(
"رقم العقد",
data.contractNo,
"الإمارة",
data.emirate
);

drawInfoRow(
"المنطقة",
data.area,
"اسم الفني",
data.technician
);

y += 8;

drawSection(
"سبب الزيارة | Reason of Visit",
data.visitReason
);

drawSection(
"الإجراء المتبع | Action Taken",
data.actionTaken
);

drawSection(
"التوصيات الفنية | Technical Recommendation",
data.recommendation
);

pdf.setFillColor(...gray);

pdf.roundedRect(
20,
y,
170,
16,
2,
2,
"FD"
);

pdf.setTextColor(...blue);

pdf.setFont("times","bold");
pdf.setFontSize(15);

pdf.text(
"Required Amount : " +
(data.requiredAmount || "0") +
" AED",
105,
y + 10,
null,
null,
"center"
);

y += 42;

pdf.setTextColor(0,0,0);

pdf.line(25,y,75,y);
pdf.line(135,y,185,y);

pdf.setFontSize(12);

pdf.text(
"Customer Signature",
50,
y + 7,
null,
null,
"center"
);

pdf.text(
"توقيع العميل",
50,
y + 13,
null,
null,
"center"
);

pdf.text(
"Technician Signature",
160,
y + 7,
null,
null,
"center"
);

pdf.text(
"توقيع الفني",
160,
y + 13,
null,
null,
"center"
);

pdf.setFontSize(9);

pdf.setTextColor(120);

pdf.text(
"SMOU GROUP - Maintenance Department",
105,
287,
null,
null,
"center"
);

const fileName =
"SMOU-Report-" +
data.reportNo +
".pdf";

if(shareMode){

const blob =
pdf.output("blob");

const file =
new File(
[blob],
fileName,
{type:"application/pdf"}
);

if(
navigator.canShare &&
navigator.canShare({files:[file]})
){

await navigator.share({
title:"SMOU Maintenance Report",
files:[file]
});

}else{

pdf.save(fileName);

}

}else{

pdf.save(fileName);

}

function drawInfoRow(
label1,
value1,
label2,
value2
){

pdf.setFillColor(...blue);

pdf.rect(20,y,35,10,"F");
pdf.rect(105,y,35,10,"F");

pdf.setTextColor(255,255,255);

pdf.setFontSize(11);

pdf.text(
label1,
37.5,
y + 6,
null,
null,
"center"
);

pdf.text(
label2,
122.5,
y + 6,
null,
null,
"center"
);

pdf.setTextColor(0,0,0);

pdf.rect(55,y,50,10);
pdf.rect(140,y,50,10);

pdf.setFont("times","bold");

pdf.text(
String(value1 || ""),
80,
y + 6,
null,
null,
"center"
);

pdf.text(
String(value2 || ""),
165,
y + 6,
null,
null,
"center"
);

y += 10;

}

function drawSection(title,value){

pdf.setFillColor(...gray);

pdf.roundedRect(
20,
y,
170,
10,
2,
2,
"FD"
);

pdf.setTextColor(...blue);

pdf.setFont("times","bold");
pdf.setFontSize(13);

pdf.text(
title,
105,
y + 6,
null,
null,
"center"
);

pdf.setDrawColor(220,227,236);

pdf.roundedRect(
20,
y + 10,
170,
26,
2,
2
);

pdf.setTextColor(0,0,0);

pdf.setFont("times","normal");
pdf.setFontSize(12);

const lines =
pdf.splitTextToSize(
String(value || ""),
158
);

pdf.text(
lines,
25,
y + 18
);

y += 42;

}

}

</script>

</body>

</html>
